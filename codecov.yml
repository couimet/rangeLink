# Codecov configuration for couimet/rangeLink monorepo.
# See: https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    project:
      rangelink-core-ts:
        target: 100%
        threshold: 0%
        flags:
          - rangelink-core-ts
      rangelink-vscode-extension:
        target: 98%
        threshold: 0%
        flags:
          - rangelink-vscode-extension
      rangelink-text-fragment-ts:
        target: 100%
        threshold: 0%
        flags:
          - rangelink-text-fragment-ts
      text-fragment-ts:
        target: 100%
        threshold: 0%
        flags:
          - text-fragment-ts
      percent-codec-ts:
        target: 100%
        threshold: 0%
        flags:
          - percent-codec-ts

    patch:
      default:
        informational: true

flag_management:
  default_rules:
    carryforward: true

flags:
  rangelink-core-ts:
    paths:
      - packages/rangelink-core-ts/
  rangelink-vscode-extension:
    paths:
      - packages/rangelink-vscode-extension/
  rangelink-text-fragment-ts:
    paths:
      - packages/rangelink-text-fragment-ts/
  text-fragment-ts:
    paths:
      - packages/text-fragment-ts/
  percent-codec-ts:
    paths:
      - packages/percent-codec-ts/

comment:
  layout: 'reach, diff, flags, files, footer'
  behavior: default
  require_changes: false
